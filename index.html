<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skener Houseboats</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px;
  font-family: Arial, sans-serif;
  background: #f1f5f8; color: #183044;
  text-align: center;
}
.app {
  max-width: 560px; margin: auto; padding: 20px;
  background: white; border-radius: 20px;
  box-shadow: 0 4px 18px #0001;
}
h1 { font-size: 25px; }
p { line-height: 1.5; }
select, button {
  width: 100%; padding: 15px; margin: 8px 0;
  border-radius: 11px; font-size: 17px;
}
select { border: 1px solid #bbb; background: white; }
button { border: 0; background: #174e70; color: white; font-weight: bold; }
button.secondary { background: #657988; }
button.light { background: #e5edf2; color: #183044; }
button:disabled { opacity: .45; }
video {
  width: 100%; max-height: 60vh;
  background: #17232c; border-radius: 12px; margin-top: 12px;
}
#workCanvas {
  display: none; width: 100%; height: auto;
  margin-top: 12px; border-radius: 10px;
  border: 2px solid #d4dfe6; touch-action: pan-y;
}
#status {
  padding: 13px; margin-top: 12px;
  border-radius: 10px; background: #edf3f7;
  overflow-wrap: anywhere; line-height: 1.5;
}
.small { font-size: 13px; color: #61717d; }
</style>
</head>
<body>
<div class="app">
  <h1>📷 Skener Houseboats</h1>
  <p>Vyber houseboat a vyfoť registrační lístek.</p>

  <label for="arrival">Příjezd:</label>
<input type="date" id="arrival">

<label for="departure">Odjezd:</label>
<input type="date" id="departure">

  <select id="boat">
    <option value="Daisy">Daisy</option>
    <option value="Rosie">Rosie</option>
    <option value="Poppy">Poppy</option>
    <option value="Lilly">Lilly</option>
  </select>

  <video id="video" autoplay playsinline muted style="display:none"></video>
  <canvas id="workCanvas"></canvas>

  <button id="start" onclick="startCamera()">Otevřít fotoaparát</button>
  <button id="capture" onclick="takePhoto()" style="display:none">Vyfotit lístek</button>

  <button id="auto" class="light" onclick="autoScan()" style="display:none">
    Zkusit automatické oříznutí
  </button>

  <button id="manual" class="light" onclick="startManual()" style="display:none">
    Označit rohy ručně
  </button>

  <button id="undo" class="secondary" onclick="undoPoint()" style="display:none">
    Vrátit poslední roh
  </button>

  <button id="finish" onclick="finishManual()" style="display:none">
    Narovnat označený dokument
  </button>

  <button id="retake" class="secondary" onclick="retakePhoto()" style="display:none">
    Vyfotit znovu
  </button>

  <button id="send" onclick="sendPhoto()" style="display:none">
    Předat do domovní knihy
  </button>

  <div id="status">Skener je připraven.</div>
  <p class="small">
    Ruční ořez: klepni postupně na čtyři rohy papíru v pořadí od levého horního rohu po směru hodinových ručiček.
  </p>
</div>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<script>
let stream = null;
let photoBlob = null;
let originalImage = null;
let points = [];
let manualMode = false;
let cvReady = false;

const video = document.getElementById('video');
const canvas = document.getElementById('workCanvas');
const ctx = canvas.getContext('2d');
const statusBox = document.getElementById('status');

function status(message) {
  statusBox.textContent = message;
}

function show(id, visible) {
  document.getElementById(id).style.display = visible ? 'block' : 'none';
}

function loadCV() {
  if (typeof cv !== 'undefined' && cv.Mat) {
    cvReady = true;
    return;
  }
  if (typeof cv !== 'undefined') {
    cv.onRuntimeInitialized = function() { cvReady = true; };
  } else {
    setTimeout(loadCV, 500);
  }
}
loadCV();

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });

    video.srcObject = stream;
    show('video', true);
    show('start', false);
    show('capture', true);
    show('auto', false);
    show('manual', false);
    show('undo', false);
    show('finish', false);
    show('retake', false);
    show('send', false);
    show('workCanvas', false);

    status('Kamera je zapnutá. Zaměř celý lístek.');
  } catch (e) {
    status('Kameru se nepodařilo otevřít: ' + e.message);
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
}

function takePhoto() {
  if (!video.videoWidth) {
    status('Kamera ještě není připravena.');
    return;
  }

  const temp = document.createElement('canvas');
  temp.width = video.videoWidth;
  temp.height = video.videoHeight;
  temp.getContext('2d').drawImage(video, 0, 0);

  temp.toBlob(blob => {
    if (!blob) {
      status('Fotografii se nepodařilo vytvořit.');
      return;
    }

    photoBlob = blob;
    const image = new Image();

    image.onload = function() {
      originalImage = image;
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;
      drawOriginal();

      show('video', false);
      show('workCanvas', true);
      show('capture', false);
      show('auto', true);
      show('manual', true);
      show('retake', true);
      show('send', true);

      status('Fotografie pořízena. Vyber automatické nebo ruční oříznutí.');
      stopCamera();
    };

    image.src = URL.createObjectURL(blob);
  }, 'image/jpeg', 0.94);
}

function drawOriginal() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(originalImage, 0, 0);
}

function startManual() {
  if (!originalImage) return;

  points = [];
  manualMode = true;
  drawOriginal();

  show('undo', true);
  show('finish', true);
  show('auto', false);
  show('manual', false);

  status('Klepni na 1. roh: LEVÝ HORNÍ roh papíru.');
}

canvas.addEventListener('click', function(event) {
  if (!manualMode || points.length >= 4) return;

  const rect = canvas.getBoundingClientRect();
  const x = (event.clientX - rect.left) * canvas.width / rect.width;
  const y = (event.clientY - rect.top) * canvas.height / rect.height;

  points.push({x, y});
  drawPoints();

  const labels = [
    'pravý horní',
    'pravý dolní',
    'levý dolní'
  ];

  if (points.length < 4) {
    status('Roh ' + points.length + ' označen. Teď označ ' + labels[points.length - 1] + ' roh.');
  } else {
    status('Všechny čtyři rohy jsou označené. Klepni na Narovnat označený dokument.');
  }
});

function drawPoints() {
  drawOriginal();

  ctx.lineWidth = Math.max(4, canvas.width / 300);
  ctx.strokeStyle = '#00d084';
  ctx.fillStyle = '#ff3b30';

  points.forEach((p, i) => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(12, canvas.width / 100), 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold ' + Math.max(24, canvas.width / 35) + 'px Arial';
    ctx.fillText(String(i + 1), p.x + 15, p.y - 15);
    ctx.fillStyle = '#ff3b30';
  });

  if (points.length > 1) {
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i].x, points[i].y);
    }
    if (points.length === 4) ctx.closePath();
    ctx.strokeStyle = '#00d084';
    ctx.stroke();
  }
}

function undoPoint() {
  if (points.length) {
    points.pop();
    drawPoints();
    status('Poslední roh odebrán. Označ další roh.');
  }
}

function finishManual() {
  if (points.length !== 4) {
    status('Nejdříve označ všechny čtyři rohy.');
    return;
  }
  rectify(points);
}

function autoScan() {
  if (!cvReady) {
    status('Skenovací knihovna se ještě načítá. Chvilku počkej.');
    return;
  }

  status('Zkouším automaticky najít okraje…');

  let src, gray, blur, edges, contours, hierarchy, approx;
  let best = null;
  let bestArea = 0;

  try {
    src = cv.imread(originalImage);
    gray = new cv.Mat();
    blur = new cv.Mat();
    edges = new cv.Mat();
    contours = new cv.MatVector();
    hierarchy = new cv.Mat();
    approx = new cv.Mat();

    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);
    cv.Canny(blur, edges, 35, 120);
    cv.dilate(edges, edges, cv.Mat.ones(3, 3, cv.CV_8U));

    cv.findContours(edges, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

    for (let i = 0; i < contours.size(); i++) {
      const c = contours.get(i);
      const perimeter = cv.arcLength(c, true);
      cv.approxPolyDP(c, approx, 0.025 * perimeter, true);

      if (approx.rows === 4) {
        const area = Math.abs(cv.contourArea(approx));
        if (area > bestArea && area > src.cols * src.rows * 0.08) {
          bestArea = area;
          best = [];
          for (let j = 0; j < 4; j++) {
            best.push({x: approx.intAt(j, 0), y: approx.intAt(j, 1)});
          }
        }
      }
      c.delete();
    }

    if (best) {
      rectify(orderPoints(best));
    } else {
      status('Automatika okraje nenašla. Zkus označit čtyři rohy ručně.');
    }
  } catch (e) {
    status('Automatické hledání se nezdařilo. Použij ruční ořez.');
  } finally {
    if (src) src.delete();
    if (gray) gray.delete();
    if (blur) blur.delete();
    if (edges) edges.delete();
    if (contours) contours.delete();
    if (hierarchy) hierarchy.delete();
    if (approx) approx.delete();
  }
}

function orderPoints(p) {
  const sums = p.map(a => a.x + a.y);
  const diffs = p.map(a => a.x - a.y);
  return [
    p[sums.indexOf(Math.min(...sums))],
    p[diffs.indexOf(Math.max(...diffs))],
    p[sums.indexOf(Math.max(...sums))],
    p[diffs.indexOf(Math.min(...diffs))]
  ];
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function rectify(p) {
  if (!cvReady) {
    status('Skenovací knihovna se ještě načítá.');
    return;
  }

  let src, from, to, matrix, result;

  try {
    const ordered = orderPoints(p);

    const w = Math.round(Math.max(
      dist(ordered[0], ordered[1]),
      dist(ordered[3], ordered[2])
    ));

    const h = Math.round(Math.max(
      dist(ordered[0], ordered[3]),
      dist(ordered[1], ordered[2])
    ));

    if (w < 100 || h < 100) {
      status('Označená oblast je příliš malá. Zkus rohy označit znovu.');
      return;
    }

    src = cv.imread(originalImage);

    from = cv.matFromArray(4, 1, cv.CV_32FC2, [
      ordered[0].x, ordered[0].y,
      ordered[1].x, ordered[1].y,
      ordered[2].x, ordered[2].y,
      ordered[3].x, ordered[3].y
    ]);

    to = cv.matFromArray(4, 1, cv.CV_32FC2, [
      0, 0, w, 0, w, h, 0, h
    ]);

    matrix = cv.getPerspectiveTransform(from, to);
    result = new cv.Mat();

    cv.warpPerspective(src, result, matrix, new cv.Size(w, h));

    canvas.width = w;
    canvas.height = h;
    cv.imshow(canvas, result);

    canvas.toBlob(blob => {
      if (blob) {
        photoBlob = blob;
        manualMode = false;
        points = [];

        show('undo', false);
        show('finish', false);
        show('auto', true);
        show('manual', true);
        show('send', true);

        status('Dokument je narovnan. Zkontroluj celý lístek a čitelnost údajů.');
      }
    }, 'image/jpeg', 0.94);

  } catch (e) {
    status('Narovnání se nezdařilo. Zkus označit rohy znovu.');
  } finally {
    if (src) src.delete();
    if (from) from.delete();
    if (to) to.delete();
    if (matrix) matrix.delete();
    if (result) result.delete();
  }
}

function retakePhoto() {
  photoBlob = null;
  originalImage = null;
  points = [];
  manualMode = false;
  startCamera();
}

function sendPhoto() {
  if (!photoBlob) {
    status('Nejdříve vyfoť dokument.');
    return;
  }

  if (!window.opener) {
    status('Skener zatím není propojen s domovní knihou. Fotografii neposílám.');
    return;
  }

  const reader = new FileReader();
  reader.onloadend = function() {
    window.opener.postMessage({
      type: 'HOUSEBOAT_SCAN',
      boat: document.getElementById('boat').value,
      arrival: document.getElementById('arrival').value,
departure: document.getElementById('departure').value,
      base64Data: reader.result.split(',')[1],
      fileName: 'registracni_listek.jpg',
      mimeType: 'image/jpeg'
    }, '*');

    status('Fotografie byla předána. Toto okno můžeš zavřít.');
  };
  reader.readAsDataURL(photoBlob);
}

window.addEventListener('beforeunload', stopCamera);
</script>
</body>
</html>
